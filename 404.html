      position: relative; z-index: 1;
    }
    .err-code {

      font-size: clamp(90px, 18vw, 160px); line-height: 1;

    .err-actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .err-btn {

      font-weight: 700; font-size: 15px; text-decoration: none;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    .err-btn-primary { background: var(--accent); color: var(--bg-base); }
    .err-btn-primary:hover { background: var(--accent-hover); }
    .err-btn-ghost {
      color: var(--text-sec);
      border: 1.5px solid var(--border);
    }
    .err-btn-ghost:hover { color: var(--accent); border-color: var(--accent); }
    footer {
      text-align: center; padding: 20px;
